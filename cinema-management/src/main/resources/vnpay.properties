# VNPay integration configuration for CinemaHub.
#
# IMPORTANT:
# - DO NOT commit real secrets here. The committed values are SANDBOX defaults published
#   by VNPay for public test integration — see VNPay sandbox docs.
# - For production, override via environment variables: VNPAY_TMN_CODE, VNPAY_HASH_SECRET,
#   VNPAY_PAY_URL, VNPAY_RETURN_URL, VNPAY_IPN_URL, VNPAY_ENVIRONMENT=PRODUCTION.
# - The Java config layer reads system properties first (cinema.vnpay.*), then env,
#   then this file.

vnpay.environment=SANDBOX
vnpay.tmnCode=4HP0IFJB
vnpay.hashSecret=NTAPMXXMQJUWYXYQFRBQIQZZOQVESORY

# Sandbox URL — MUST stay in SANDBOX unless VNPAY_ENVIRONMENT=PRODUCTION
vnpay.payUrl=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html

# Override these with the public URL of the deployed CinemaHub instance so VNPay can reach them.
vnpay.returnUrl=http://localhost:8080/vnpay/return
vnpay.ipnUrl=http://localhost:8080/vnpay/ipn

# Expiration (minutes) for the payment URL (vnp_ExpireDate).
vnpay.expireMinutes=15
